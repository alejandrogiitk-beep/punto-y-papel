
{% extends "base.html" %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}

<section class="contenedor-formulario">

    <article class="formulario-tarjeta">

        <h1>Crear cuenta</h1>
        <p>Registrate para acceder al sistema.</p>

        <form method="POST" action="{{ url_for('registro') }}"
              id="formRegistro">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre"
                   minlength="3" maxlength="80" required>

            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" name="correo"
                   autocomplete="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   minlength="8" autocomplete="new-password" required>

            <button class="boton completo" type="submit">
                Registrarme
            </button>

        </form>

        <p>¿Ya tienes cuenta?
            <a href="{{ url_for('login') }}">Inicia sesion</a>
        </p>

    </article>

</section>

{% endblock %}
